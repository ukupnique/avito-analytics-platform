[project]
name = "avito-analytics-platform"
version = "0.1.0"
description = "Avito Analytics Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn",
    "uvicorn-worker",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.4.0",
    "pwdlib[argon2]>=0.3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "PyJWT",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Импорт модели регистрирует таблицу в Base.metadata для Alembic.
"**/alembic/env.py" = ["F401"]
# Alembic добавляет стандартные импорты даже в пустые миграции.
"**/alembic/versions/*.py" = ["F401"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
app = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]
